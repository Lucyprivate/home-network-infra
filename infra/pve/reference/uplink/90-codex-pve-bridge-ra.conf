# Keep IPv6 link-local; reject router-advertised host defaults.
net.ipv6.conf.vmbr0.accept_ra=0
net.ipv6.conf.vmbr0.accept_ra_defrtr=0
net.ipv6.conf.vmbr1.accept_ra=0
net.ipv6.conf.vmbr1.accept_ra_defrtr=0
net.ipv6.conf.vmbr2.accept_ra=0
net.ipv6.conf.vmbr2.accept_ra_defrtr=0
net.ipv6.conf.vmbr3.accept_ra=0
net.ipv6.conf.vmbr3.accept_ra_defrtr=0
net.ipv6.conf.enp4s0.accept_ra=0
net.ipv6.conf.enp4s0.accept_ra_defrtr=0
net.ipv6.conf.enp5s0.accept_ra=0
net.ipv6.conf.enp5s0.accept_ra_defrtr=0
