- Applications:
  - Jellyfin:
      href: http://10.10.10.42:8096
      description: Watch live TV and browse your media.
      icon: mdi-apps
      widget:
        type: customapi
        url: http://127.0.0.1:3000/icons/health/status.json
        refreshInterval: 30000
        mappings:
        - field: services.jellyfin.state
          label: Status
          remap:
          - value: Online
            to: 🟢 Online
          - value: Offline
            to: 🔴 Offline
        - field: checked_at
          label: Checked
          format: relativeDate
