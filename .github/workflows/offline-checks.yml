name: Offline reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y busybox
      - run: python3 scripts/check_publication.py --git-blobs
      - run: python3 scripts/check_offline.py
      - run: python3 scripts/render.py --output build/example
      - run: python3 scripts/validate.py --rendered build/example
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Offline Windows review
        shell: pwsh
        run: ./scripts/check-windows.ps1
